server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Redirects keep the host and scheme the browser used: behind the tunnel,
    # nginx itself only sees plain http on port 8080.
    absolute_redirect off;

    location /web/ {
        # Bundle names carry no hash, so browsers must always revalidate.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /web {
        return 301 /web/;
    }

    location / {
        return 404;
    }
}
